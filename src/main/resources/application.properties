spring.application.name=inventario-floci

# --- Conexión a MySQL ---
# Los valores se pueden sobreescribir con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventario?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:inventario}
spring.datasource.password=${DB_PASSWORD:inventario}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---
server.port=${SERVER_PORT:8080}

# --- Actuator ---
# Expone /actuator/health con el detalle de la conexión a la base de datos.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
